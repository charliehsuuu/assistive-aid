<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
</head><body>
<title>輔具補助速查</title>
<meta name="theme-color" content="#1f3b3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: phone-first tool — sticky identity bar, one working column, bottom tab bar.
   Color encodes the two schemes: ochre = 長照, teal = 身障. */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --sunk:#e9eeec; --ink:#1b2827; --muted:#5a6866; --line:#d6dedb;
  --ltc:#a85a14; --ltc-soft:#f6e9da; --dis:#17706d; --dis-soft:#dcefed;
  --brand:#1f3b3a; --brand-fg:#f3f5f3; --good:#2c7a3f; --warn:#9a6a00; --bad:#b23a32;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111817; --surface:#18211f; --sunk:#0d1312; --ink:#e4ebe8; --muted:#9aaba7; --line:#2b3835;
  --ltc:#e3a05f; --ltc-soft:#3a2a1a; --dis:#5cc2bd; --dis-soft:#163432;
  --brand:#0b1615; --brand-fg:#e4ebe8; --good:#6cc684; --warn:#e2b54f; --bad:#ef8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111817; --surface:#18211f; --sunk:#0d1312; --ink:#e4ebe8; --muted:#9aaba7; --line:#2b3835;
  --ltc:#e3a05f; --ltc-soft:#3a2a1a; --dis:#5cc2bd; --dis-soft:#163432;
  --brand:#0b1615; --brand-fg:#e4ebe8; --good:#6cc684; --warn:#e2b54f; --bad:#ef8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--dis);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 96px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-fg)}
.top .row{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-size:18px;margin:0;letter-spacing:.04em;flex:1 1 auto}
.idchip{border:1px solid color-mix(in srgb,var(--brand-fg) 35%,transparent);background:transparent;color:var(--brand-fg);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.idchip b{font-weight:700}

.settings{background:var(--surface);border-bottom:1px solid var(--line)}
.settings .inner{max-width:760px;margin:0 auto;padding:14px 16px;display:grid;gap:12px}
.field{display:grid;gap:6px}
.field>label,.field>.lab{font-size:12px;color:var(--muted);letter-spacing:.06em}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg.ltc button[aria-pressed="true"]{background:var(--ltc);border-color:var(--ltc);color:var(--surface)}
.seg.dis button[aria-pressed="true"]{background:var(--dis);border-color:var(--dis);color:var(--surface)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input[type=number],input[type=search],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:16px}
.hint{font-size:12px;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;font-size:13px;color:var(--muted);cursor:pointer;display:grid;justify-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700}

section.view{padding-top:16px;display:grid;gap:14px}
h2{font-size:17px;margin:4px 0 0}
.searchbar{display:grid;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.result{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.item.ltc{border-left-color:var(--ltc)} .item.dis{border-left-color:var(--dis)}
.item .code{font-family:var(--f-num);font-size:12px;padding:1px 6px;border-radius:5px;white-space:nowrap}
.item.ltc .code{background:var(--ltc-soft);color:var(--ltc)} .item.dis .code{background:var(--dis-soft);color:var(--dis)}
.item .nm{min-width:0;font-weight:500}
.item .amt{font-family:var(--f-num);font-size:13px;text-align:right;white-space:nowrap}
.item .sub{grid-column:2/4;font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-right:4px;white-space:nowrap}
.tag.rent{border-color:var(--ltc);color:var(--ltc)}
.tag.full{border-color:var(--dis);color:var(--dis)}
.groupLabel{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-top:6px}
.empty{color:var(--muted);font-size:14px;padding:12px 0}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
.panel .head{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);z-index:2}
.panel .head h3{margin:0;font-size:17px;flex:1;min-width:0;text-wrap:balance}
.close{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;cursor:pointer}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;margin-top:12px}
.block.ltc{border-top:3px solid var(--ltc)} .block.dis{border-top:3px solid var(--dis)}
.block h4{margin:0;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sys{font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;color:var(--surface)}
.sys.ltc{background:var(--ltc)} .sys.dis{background:var(--dis)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.out{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.out .big{font-family:var(--f-num);font-weight:600;font-size:18px;text-align:right}
.out .v{font-family:var(--f-num);text-align:right}
.out .k{color:var(--muted)}
.out .k.strong{color:var(--ink);font-weight:700}
details.rules summary{cursor:pointer;font-size:13px;color:var(--muted)}
details.rules pre{white-space:pre-wrap;font-family:var(--f-body);font-size:13px;line-height:1.7;margin:8px 0 0;max-height:360px;overflow:auto}
.verdict{border:1px solid var(--ink);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--surface);margin-top:12px}
.verdict h4{margin:0;font-size:15px}
.verdict ul{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:14px}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmpcell{border-radius:8px;padding:10px;display:grid;gap:2px}
.cmpcell.ltc{background:var(--ltc-soft)} .cmpcell.dis{background:var(--dis-soft)}
.cmpcell .lbl{font-size:12px;color:var(--muted)}
.cmpcell .val{font-family:var(--f-num);font-weight:600;font-size:18px}
.cmpcell.win{outline:2px solid var(--good)}
.warnline{font-size:13px;color:var(--warn)}
.src{font-size:12px;color:var(--muted)}

/* compare overview table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--surface)}
td.n{font-family:var(--f-num);text-align:right;white-space:nowrap}
tr[data-l]{cursor:pointer}
tr[data-l]:hover td{background:var(--sunk)}
th.ltc{color:var(--ltc)} th.dis{color:var(--dis)}

/* AI */
.chat{display:grid;gap:10px}
.msg{border-radius:12px;padding:10px 12px;font-size:15px;max-width:100%;overflow-wrap:anywhere}
.msg.u{background:var(--ink);color:var(--bg);justify-self:end;max-width:88%}
.msg.a{background:var(--surface);border:1px solid var(--line)}
.msg.a p{margin:.3em 0} .msg.a ul{margin:.3em 0;padding-left:1.3em}
.msg.a table{min-width:0;font-size:13px}
.msg .status{font-size:12px;color:var(--muted)}
.composer{display:grid;gap:8px}
.composer .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.notice{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px}

/* rules */
.rule{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.rule h3{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule p,.rule li{font-size:14px;margin:.25em 0}
.rule ul{margin:0;padding-left:1.2em}
.rule .ext{border:1px dashed var(--warn);border-radius:8px;padding:8px 10px;margin-top:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="row">
    <h1>輔具補助速查</h1>
    <button class="idchip" id="idchip" aria-expanded="false" aria-controls="settings">身分：<b id="idsum"></b></button>
  </div>
</header>

<div class="settings" id="settings" hidden>
  <div class="inner">
    <div class="field"><span class="lab">民眾符合哪一種資格</span>
      <div class="seg" id="s-who" role="group">
        <button data-v="ltc">只符合長照</button><button data-v="dis">只符合身障</button><button data-v="both">兩者都符合</button>
      </div></div>
    <div class="grid2">
      <div class="field" id="f-cls"><span class="lab">長照身分別（決定部分負擔）</span>
        <div class="seg ltc" id="s-cls" role="group">
          <button data-v="1">第一類 0%</button><button data-v="2">第二類 10%</button><button data-v="3">第三類 30%</button>
        </div>
        <span class="hint">第一類：低收／中低收入戶等；第二類：中低收入老人津貼第二款或身障生活補助資格；第三類：一般戶（第14條）</span></div>
      <div class="field" id="f-hh"><span class="lab">身障戶別（決定補助比例）</span>
        <div class="seg dis" id="s-hh" role="group">
          <button data-v="low">低收入戶</button><button data-v="mid">中低收入戶</button><button data-v="gen">一般戶</button>
        </div>
        <span class="hint">※ 項目三種戶別皆全額；其餘依辦法第3條：100%／75%／50%</span></div>
    </div>
    <div class="grid2" id="f-quota">
      <div class="field"><span class="lab">長照輔具額度組別（三年）</span>
        <div class="seg ltc" id="s-grp" role="group"><button data-v="1">第一組 40,000</button><button data-v="2">第二組 60,000</button></div></div>
      <div class="field"><label for="i-used">這三年已用掉的長照輔具額度（元）</label>
        <input id="i-used" type="number" inputmode="numeric" min="0" step="100" placeholder="0"></div>
    </div>
    <div><button class="btn ghost" id="closeSettings">完成</button></div>
  </div>
</div>

<main class="wrap">
  <!-- 查詢 -->
  <section class="view" id="v-find">
    <div class="searchbar">
      <input id="q" type="search" placeholder="輸入輔具名稱或代號，例：輪椅、EC02、氣墊床" aria-label="搜尋輔具" autocomplete="off">
      <div class="chips" id="chips"></div>
    </div>
    <div class="result" id="res"></div>
  </section>

  <!-- 比較 -->
  <section class="view" id="v-cmp" hidden>
    <h2>長照 × 身障 對照表</h2>
    <p class="hint" style="margin:0">同一種輔具在兩套制度的上限並列。點任一列看依目前身分的試算與建議。「近」表示規格分級不完全相同，請核對規格。</p>
    <div class="tablewrap"><table id="cmpTable"></table></div>
  </section>



  <!-- 規定 -->
  <section class="view" id="v-rules" hidden></section>
</main>

<nav class="tabs" aria-label="主要功能"><div class="in" role="tablist">
  <button role="tab" data-t="find" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>查詢試算</button>
  <button role="tab" data-t="cmp" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 6h7v13H4zM13 6h7v13h-7z"/></svg>兩制對照</button>

  <button role="tab" data-t="rules" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h4"/></svg>規定重點</button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

function calcLtc(it, {cls=S.cls, mode, price, months=1, bilateral=false}={}){
  const r = it.exempt ? 0 : RATE[cls];
  const canRent = it.rent!=null, canBuy = it.buy!=null;
  if (!mode) mode = canBuy ? 'buy' : (canRent ? 'rent' : null);
  if (!mode || (mode==='buy'&&!canBuy) || (mode==='rent'&&!canRent))
    return {ok:false, reason: it.id.startsWith('EI') ? '智慧科技輔具：租賃價格由長照特約單位訂定並報地方主管機關備查，附表四之一未訂固定上限。' : (mode==='buy' ? '此項限租賃，不能購置。' : '此項限購置，不能租賃。')};
  const mult = (bilateral && (it.id==='EB01'||it.id==='EB02')) ? 2 : 1;
  const capUnit = (mode==='buy' ? it.buy : it.rent) * mult;
  const unitPrice = (price==null || price==='' || isNaN(price)) ? capUnit : Number(price);
  const m = mode==='rent' ? Math.max(1, Number(months)||1) : 1;
  const covered = Math.min(unitPrice, capUnit) * m;
  const copay = Math.floor(covered * r);
  const gov = covered - copay;
  const over = Math.max(0, unitPrice - capUnit) * m;
  return {ok:true, mode, rate:r, capUnit, unitPrice, months:m, covered, copay, gov, over, selfPay: copay+over, quotaUse: covered};
}
function calcDis(it, {hh=S.hh, price, bilateral=false}={}){
  const ratio = it.full ? 1 : HHR[hh];
  if (it.amt==null) return {ok:false, reason:'最高補助金額非固定數字：'+it.amtText};
  const base = it.amt * ((bilateral && (it.id===42||it.id===43)) ? 2 : 1);
  const max = Math.round(base * ratio);
  const p = (price==null || price==='' || isNaN(price)) ? base : Number(price);
  const gov = Math.min(p, max);
  return {ok:true, ratio, max, price:p, gov, selfPay: Math.max(0,p-gov)};
}

// ---------- search ----------
const norm = s => String(s||'').toLowerCase().replace(/[\s（）()\-－、，,]/g,'').replace(/[枴柺]/g,'拐').replace(/銹/g,'鏽');
const CHIPS = ['輪椅','拐杖','助行器','便盆椅','沐浴椅','氣墊床','照顧床','移位','座墊','扶手','斜坡板','電動代步車','爬梯機','助聽器'];
function search(q){
  const nq = norm(q); if(!nq) return {l:[],d:[]};
  const hit = (code,name)=> norm(code)===nq || norm(name).includes(nq) || (nq.length>=3 && norm(code).startsWith(nq));
  const l = S.who==='dis' ? [] : LTC.filter(x=>hit(x.id,x.name));
  const d = S.who==='ltc' ? [] : DIS.filter(x=>hit(String(x.id),x.name) || norm(x.cat).includes(nq) && nq.length>=4);
  return {l,d};
}

// comparison verdict between one LTC item and one DIS item
function compareText(l, d, q, price, months){
  const lines = [];
  if (price==null) price = Math.max(l.buy||0, d.amt||0);
  const dr = calcDis(d, {price});
  const lb = l.buy!=null ? calcLtc(l, {mode:'buy', price}) : null;
  const lr = l.rent!=null ? calcLtc(l, {mode:'rent', months}) : null;
  let best = '', cells = '';
  if (lb && dr.ok){
    const win = lb.gov===dr.gov ? 'tie' : (lb.gov>dr.gov ? 'ltc' : 'dis');
    cells = `<div class="cmpgrid"><div class="cmpcell ltc ${win==='ltc'?'win':''}"><span class="lbl">長照購置補助</span><span class="val">${fmt(lb.gov)}</span><span class="lbl">自付 ${fmt(lb.selfPay)}</span></div>
      <div class="cmpcell dis ${win==='dis'?'win':''}"><span class="lbl">身障購置補助</span><span class="val">${fmt(dr.gov)}</span><span class="lbl">自付 ${fmt(dr.selfPay)}</span></div></div>`;
    best = win==='tie' ? '以購買價格 '+fmt(price ?? Math.max(l.buy,d.amt))+' 元試算，兩邊補助相同。' : `以購買價格 ${fmt(price ?? Math.max(l.buy,d.amt))} 元試算，<b>${win==='ltc'?'長照':'身障'}</b>補助較多，差 ${fmt(Math.abs(lb.gov-dr.gov))} 元。`;
  }
  if (!lb && lr && dr.ok){
    const per = lr.gov / lr.months; const be = per>0 ? Math.ceil(dr.gov/per) : null;
    cells = `<div class="cmpgrid"><div class="cmpcell ltc"><span class="lbl">長照只能租：每月補助</span><span class="val">${fmt(per)}</span><span class="lbl">${lr.months} 個月共 ${fmt(lr.gov)}</span></div>
      <div class="cmpcell dis"><span class="lbl">身障一次購置補助</span><span class="val">${fmt(dr.gov)}</span><span class="lbl">自付 ${fmt(dr.selfPay)}</span></div></div>`;
    best = `長照此項<b>限租賃</b>，身障是<b>補助購買</b>。長照每月最多補助 ${fmt(per)} 元，大約租 ${be} 個月後累計補助會追上身障的一次補助 ${fmt(dr.gov)} 元。短期使用偏向長照租賃；長期使用、且民眾能先負擔購買自付額，偏向身障購置。`;
  }
  if (lb && lr) lines.push(`長照此項可租可買：租賃每月上限 ${fmt(l.rent)} 元（${S.cls?('部分負擔 '+(l.exempt?0:RATE[S.cls]*100)+'%'):''}），${months} 個月長照給付 ${fmt(lr.gov)} 元；短期需求可考慮租，不必一次自付購買差額。`);
  lines.push(`長照補助會用掉三年輔具額度（第一組 40,000／第二組 60,000，與其他輔具及居家無障礙共用）。這次用身障申請，可把長照額度留給其他品項。`);
  lines.push(`身障補助原則上每人每二年度補助 4 項（辦法第7條），用掉一個名額。`);
  if (l.years!=null && /^\d+$/.test(d.years) && String(l.years)!==d.years) lines.push(`最低使用年限不同：長照 ${l.years} 年、身障 ${d.years} 年，下次能再申請的時間不同。`);
  if (l.eval || d.eval!=='不需評估') lines.push(`評估：長照${l.eval?'需輔具評估人員出具評估報告':'不需評估報告'}；身障「${d.eval}」。`);
  lines.push(`兩者擇一：領有身障證明的長照對象，已依其他法規購置或租賃相同項目且未達最低使用年限，不得再依長照重複申請（長照辦法第10條第3項）。`);
  if (q==='近') lines.unshift(`<span class="warnline">兩表規格分級不完全相同（例如尺寸、材質或功能），請先核對民眾要買的規格對應哪一款。</span>`);
  return `<div class="verdict"><h4>對照：長照 ${l.id} ↔ 身障 項次${d.id}</h4>${cells}<p style="margin:0">${best}</p><ul>${lines.map(x=>`<li>${x}</li>`).join('')}</ul><p class="src" style="margin:0">試算依目前身分設定；長照依附表四與附表五、身障依基準表與辦法第3條。實際以主管機關核定為準。</p></div>`;
}

    <li>EC03–EC10、EG01–EG09 等組合註明「免部分負擔」。</li></ul></div>
  <div class="rule"><h3><span class="sys ltc">長照</span>超過上限與重複申請</h3>
    <ul><li>購置或租賃價格超過附表四上限的部分、超過核定額度的部分，由民眾自付（第15條）。</li>
    <li>領有身障證明的長照對象，依法規購置或租賃與附表四相同項目且未達最低使用年限，<b>不得再依附表四重複申請</b>（第10條第3項）。</li>
    <li>附表四註明須評估的項目，由輔具服務單位甲類輔具評估人員評估；核銷文件、保固書、評估報告格式準用身障輔具費用補助辦法（第20條）。</li>
    <li>附表四輔具項目、附表四之一自 115 年 7 月 1 日施行。</li></ul></div>
  <div class="rule"><h3><span class="sys ltc">長照</span>居家無障礙（F 碼）通則</h3>
    <ul><li>須由輔具評估人員出具評估報告，判定需要始得給付；適配度評估費用不含在給付價格。</li>
    <li>範圍限長照對象使用空間，不含公共空間、未完成裝修之毛胚屋；一般損壞更換或汰舊換新不補助。</li>
    <li>最低使用年限內之同一改善處，不得重複申請。</li></ul></div>
  <div class="rule"><h3><span class="sys dis">身障</span>基準表附註</h3>
    <ul><li>補助項目前加「※」者，低收入戶、中低收入戶、一般戶都可領「最高補助金額」全額。</li>
    <li>補助以最高補助金額為上限，且以實際購買金額為限。</li>
    <li>自國外購置屬醫療器材者，須依特定醫療器材專案核准辦法申請個人自用並檢附核准文件。</li>
    <li>基準表各項為<b>購置費用補助</b>；租賃補助不在基準表內。</li></ul>
    <div class="ext"><p class="warnline" style="margin:0 0 4px">以下不在你提供的兩份檔案內，引自《身心障礙者輔具費用補助辦法》本文，請以最新公告核對：</p>
    <ul><li>第3條：非 ※ 項目，低收入戶全額、中低收入戶 75%、一般戶 50%。</li>
    <li>第7條：每人每二年度以補助 4 項為原則，同一項目在使用年限內不重複補助。</li>
    <li>第16條：未經核定前先行購買者，不予補助。</li></ul></div></div>
  <div class="rule"><h3>這個 app 的資料範圍</h3>
    <p>長照：《長期照顧服務申請及給付辦法》部分條文修正、附表二、附表四（輔具 E 碼與居家無障礙 F 碼，PDF 第 38–59 頁）、附表四之一、附表五（114/6/19 修正）。身障：《身心障礙者輔具費用補助基準表》項次 1–242。對照表中的「近」為人工比對，規格分級不完全相同。</p></div>`;
}

const chatEl = document.getElementById('chat'); let turns = []; let ctl = null; let sample = null;
const RULES = `你是台灣「身心障礙輔具中心」專員的助理。專員已判斷好民眾資格，你只負責依兩份法規資料回答輔具補助金額、能租或能買、哪個方案較好。
規則：
1. 只能用工具查到的資料回答，不可憑記憶補數字；查不到就說「兩份檔案沒有規定」。
2. 每個金額都要標出處：長照寫碼別（如 EC02）與 PDF 頁碼；身障寫項次與頁碼。
3. 長照：附表四每項有給付方式（限購置／限租賃／可租賃可購置）、租賃月上限、購置上限、最低使用年限。政府給付 = min(價格,上限) 扣掉部分負擔；部分負擔依長照身分別 第一類0%、第二類10%、第三類30%（附表五），註明免部分負擔者為0；超過上限部分自付。長照輔具額度三年一次：第一組40,000、第二組60,000（第二組只限EA01、EB01-03、FA08-44、EI01-05，其中居家無障礙20,000為限）。
4. 身障：基準表為購置補助；※項目各戶別全額；其他項目依辦法第3條（此條不在兩份檔案內，回答時要註明）低收100%、中低收75%、一般戶50%，以最高補助金額為上限且不超過實際價格。
5. 雙重資格：用 calc 工具算兩邊金額後比較；說明哪邊補助多、是否一邊只能租一邊只能買（算出租幾個月會追上）、長照會用掉三年額度、身障每二年度4項原則、長照辦法第10條第3項不得重複申請、最低使用年限與評估差異。最後給一句明確建議，並說明前提。
6. 一定要先用 calc_ltc / calc_dis 計算，不要自己心算。
7. 用繁體中文（台灣用語），先給結論再列依據，簡潔，條列。民眾沒給價格就以上限試算並說明。`;
const TOOLS = [
  {name:'search_items', description:'用關鍵字搜尋長照(附表四/四之一)與身障(基準表)輔具品項。回傳兩邊符合的品項摘要與兩制對應關係。關鍵字用品項名稱，如「輪椅」「氣墊床」，或代號 EC02、項次數字。',
   inputSchema:{type:'object',properties:{keyword:{type:'string'}},required:['keyword']},
   execute:({keyword})=>{
     const k = String(keyword||''); const nk = norm(k);
     const l = LTC.filter(x=>norm(x.id)===nk || norm(x.name).includes(nk)).slice(0,25).map(x=>({碼別:x.id,品項:x.name,給付方式:x.mode,租賃月上限:x.rent,購置上限:x.buy,最低年限:x.years,免部分負擔:x.exempt,須評估報告:x.eval,第二組可用:x.g2,頁:x.page,對應身障項次:(MAP[x.id]||[]).map(([n,q])=>n+'('+q+')')}));
     const d = DIS.filter(x=>String(x.id)===k.trim() || norm(x.name).includes(nk)).slice(0,25).map(x=>({項次:x.id,品項:x.name,最高補助金額:x.amtText,全額項目:x.full,最低年限:x.years,評估人員:x.eval,頁:x.page,對應長照碼別:(RMAP[x.id]||[]).map(([c,q])=>c+'('+q+')')}));
     return {長照:l, 身障:d};
   }},
  {name:'get_rules', description:'取得單一品項的原文規定（長照「組合內容及說明」或身障「補助相關規定」，含補助對象、規格、限制）。system 用 ltc 或 dis；id 為長照碼別或身障項次。',
   inputSchema:{type:'object',properties:{system:{type:'string',enum:['ltc','dis']},id:{type:'string'}},required:['system','id']},
   execute:({system,id})=>{
     if (system==='ltc'){ const x=LBY[String(id).toUpperCase()]; if(!x) throw new Error('查無長照碼別 '+id); return {碼別:x.id,品項:x.name,頁:x.page,原文:x.text.slice(0,6000)}; }
     const x=DBY[Number(id)]; if(!x) throw new Error('查無身障項次 '+id); return {項次:x.id,品項:x.name,頁:x.page,原文:BLOCKS[x.b].slice(0,6000)};
   }},
  {name:'calc_ltc', description:'計算長照給付。回傳政府給付、部分負擔、超過上限自付、民眾自付、占用三年額度。mode: buy 或 rent；price 為實際價格（購置總價或每月租金，可省略=以上限計）；months 租期；cls 長照身分別 1/2/3（省略用專員設定）。',
   inputSchema:{type:'object',properties:{code:{type:'string'},mode:{type:'string',enum:['buy','rent']},price:{type:'number'},months:{type:'number'},cls:{type:'string',enum:['1','2','3']},bilateral:{type:'boolean'}},required:['code']},
   execute:(a)=>{ const x=LBY[String(a.code).toUpperCase()]; if(!x) throw new Error('查無長照碼別'); return {碼別:x.id, 身分別:a.cls||S.cls, ...calcLtc(x,{mode:a.mode,price:a.price,months:a.months,cls:a.cls||S.cls,bilateral:a.bilateral})}; }},
  {name:'calc_dis', description:'計算身障輔具購置補助。household: low 低收入戶 / mid 中低收入戶 / gen 一般戶（省略用專員設定）；price 實際價格（可省略=以最高補助金額計）；bilateral 拐杖雙側（項次42、43上限2倍）。',
   inputSchema:{type:'object',properties:{no:{type:'number'},household:{type:'string',enum:['low','mid','gen']},price:{type:'number'},bilateral:{type:'boolean'}},required:['no']},
   execute:(a)=>{ const x=DBY[Number(a.no)]; if(!x) throw new Error('查無身障項次'); return {項次:x.id, 戶別:HHN[a.household||S.hh], ...calcDis(x,{hh:a.household||S.hh,price:a.price,bilateral:a.bilateral})}; }},
];
function md(s){
  const lines = esc(s).split('\n'); let out='', inList=false, tbl=[];
  const flushT = ()=>{ if(!tbl.length) return; const rows=tbl.filter(r=>!/^\|?\s*:?-{2,}/.test(r)).map(r=>r.replace(/^\||\|$/g,'').split('|'));
    out += '<div class="tablewrap"><table>'+rows.map((c,i)=>'<tr>'+c.map(x=>i?`<td>${x.trim()}</td>`:`<th>${x.trim()}</th>`).join('')+'</tr>').join('')+'</table></div>'; tbl=[]; };
  for (let l of lines){
    l = l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if (/^\s*\|/.test(l)){ if(inList){out+='</ul>';inList=false;} tbl.push(l); continue; } else flushT();
    if (/^\s*([-*•]|\d+\.)\s+/.test(l)){ if(!inList){out+='<ul>';inList=true;} out+='<li>'+l.replace(/^\s*([-*•]|\d+\.)\s+/,'')+'</li>'; continue; }
    if (inList){out+='</ul>';inList=false;}
    if (/^#{1,4}\s/.test(l)) out+='<p><b>'+l.replace(/^#+\s/,'')+'</b></p>'; else if (l.trim()) out+='<p>'+l+'</p>';
  }
  flushT(); if(inList) out+='</ul>'; return out;
}
function addMsg(role, html){ const d=document.createElement('div'); d.className='msg '+role; d.innerHTML=html; chatEl.appendChild(d); return d; }
function ctxLine(){ return `【專員設定的民眾身分】資格：${({ltc:'只符合長照',dis:'只符合身障',both:'同時符合長照與身障'})[S.who]}；長照身分別：第${S.cls}類；身障戶別：${HHN[S.hh]}；長照額度組別：第${S.grp}組，三年內已用 ${S.used||0} 元。`; }
const ERR = {not_granted:'你沒有允許這個頁面使用 Claude，問答功能已關閉。', sampling_disabled:'你的帳號目前無法使用 Claude。', rate_limited:'使用量達上限或太頻繁，請稍後再試。', session_expired:'登入已過期，請重新登入 claude.ai。', refused:'Claude 無法回答這個問題，請換個問法。', tools_unavailable:'此檢視無法使用查表工具。'};
async function ask(){
  const box = document.getElementById('ask'); const q = box.value.trim(); if(!q || !sample) return;
  box.value=''; addMsg('u', esc(q));
  turns.push({role:'user', content: ctxLine()+'\n'+q});
  const a = addMsg('a','<span class="status">查表中…</span>');
  const send=document.getElementById('send'), stop=document.getElementById('stop');
  send.disabled = true; stop.hidden = false; ctl = new AbortController();
  const tools = TOOLS.map(t=>({...t, execute:(inp,ctx)=>{ a.querySelector('.status') && (a.querySelector('.status').textContent='查表中：'+t.name+'…'); return t.execute(inp,ctx); }}));
  try{
    const keep = turns.slice(-8); if (keep[0].role!=='user') keep.shift();
    const {text} = await sample([{role:'user',content:RULES}, ...keep], {tools, signal:ctl.signal, onText:({text})=>{ a.innerHTML = md(text); }});
    a.innerHTML = md(text); turns.push({role:'assistant', content:text});
  }catch(e){
    if (e.text) a.innerHTML = md(e.text); else a.innerHTML='';
    if (e.code!=='cancelled') a.insertAdjacentHTML('beforeend', `<p class="status">${esc(ERR[e.code]||'連線中斷，可以再按一次送出。')}</p>`);
    if (['not_granted','sampling_disabled','not_declared','capability_disabled','tools_unavailable'].includes(e.code)) disableAI(ERR[e.code]);
  }finally{ send.disabled=false; stop.hidden=true; a.scrollIntoView({block:'nearest'}); }
}
const ARTIFACT_URL = 'https://claude.ai/artifact/B66HjJJ6CV62KeGULSeAKt';
function disableAI(msg){
  document.getElementById('composer').hidden = true;
  const n = document.getElementById('aiNote');
  if (msg){ n.textContent = msg; return; }
  n.innerHTML = '這個版本不能直接問 Claude。要用白話提問，請開啟 Claude 版（需登入 claude.ai 帳號），那裡的「問 Claude」分頁會依同一份法規資料回答並標出處。<p style="margin:10px 0 0"><a class="btn" style="display:inline-block;text-decoration:none" href="'+ARTIFACT_URL+'" target="_blank" rel="noopener">開啟 Claude 版問問題</a></p>';
}
if (document.getElementById('composer')) {
document.getElementById('send').onclick = ask;
document.getElementById('ask').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) ask(); });
document.getElementById('stop').onclick = ()=>ctl?.abort();
document.getElementById('clear').onclick = ()=>{ turns=[]; chatEl.innerHTML=''; };
(async()=>{
  if (!document.getElementById('composer')) return;
  if (!window.claude?.use){ disableAI(); return; }
  try { sample = await window.claude.use('sample'); } catch(e){ sample=null; }
  if (!sample){ disableAI(); return; }
  try { const lim = await sample.limits(); if (!lim.tools) disableAI('此檢視無法使用查表工具，請用其他三個分頁。'); } catch(e){}
})();
}
